---
- name: "Clone the git repository of a git-based overlay into the prefix overlay directory"
  ansible.builtin.git:
    repo: "{{ gitrepo.url }}"
    dest: "{{ gentoo_prefix_path }}/var/db/repos/{{ gitrepo.name }}"
    depth: 1
    update: false
    version: "{{ gitrepo.branch | default('HEAD') }}"

- name: "Get the currently checked out commit"
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ gentoo_prefix_path }}/var/db/repos/{{ gitrepo.name }}"
  register: current_commit
  changed_when: false

- name: "Fetch and check out the pinned commit"
  ansible.builtin.command:
    cmd: "{{ item }}"
    chdir: "{{ gentoo_prefix_path }}/var/db/repos/{{ gitrepo.name }}"
  loop:
    - "git fetch --depth 1 origin {{ gitrepo.commit }}"
    - "git checkout --force FETCH_HEAD"
  when: current_commit.stdout != gitrepo.commit
...
